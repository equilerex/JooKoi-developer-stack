    priority: 1000
    body: '`jnote` tooling built and verified: `utility-scripts/jnote.js` appends structured entries to `_architecture/process-improvement/logs.jsonl` ({ts (auto), type (default `note`; enum note/inefficiency/confusion/lost-context/useful-pattern/follow-up), content (required markdown), source?, sessionId?, agent?, model?}, plain-string or `--json` object form). `utility-scripts/setup-jnote.js` (`npm run setup:jnote`) installs a global `jnote` shell function into the Windows PowerShell profile, the pwsh (PowerShell 7) profile, and Git Bash''s `~/.bashrc`, all pointed at this repo''s absolute path — covers Windows Terminal and VS Code''s integrated terminal too, since both just host these same shells/profiles. Documented in `npm-help.js`. Purpose: near-zero-friction way for an LLM session to leave a process note (inefficiency spotted, got confused, lost context, a pattern that worked well, a follow-up worth a human look) for later review, without derailing into `TODO.md`/`BACKLOG.md` edits mid-task'
