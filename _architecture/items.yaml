  nak8:
    title: 'Paper-trail: harness-agnostic hooks check (detection, per-harness --print, no-hooks fallback)'
    status: done
    priority: 53000
    body: |-
      Follow-up to paa3 Paper-trail: enforce use for the whole session (sweep gate, hooks check, body notes, trigger table). The hooks check assumed Claude Code.

      - The script detects the harness from `CLAUDECODE` or `GEMINI_CLI`. Copilot has no reliable marker, so it needs `JOOKOI_HARNESS=copilot`, which also overrides detection generally. Undetected means no hooks are assumed.
      - `sweep` and `hooks` report missing hooks for the running harness only. When the harness is undetected, they print the fallback instead: run `list` at session start and `sweep` before ending a turn that changed files.
      - `hooks --print [--harness=claude|gemini|copilot]` prints that harness's fragment with this install's path and names the target file. It refuses when no harness is detected and none is given.
      - `SKILL.md` has a new rule: without hooks, the model is the gate. When adopting a repo, propose an `AGENTS.md` line (most harnesses load it). `hooks.md` has new "Which harness" and "Harnesses without hooks" sections. `legacy-migration.md` uses the `AGENTS.md` line when no hooks are available.

      Unverified: whether Codex or Cursor hooks could run these scripts (Cursor has added hooks). No config is shipped for them.


      First-use detail moved out of SKILL.md into references/hooks.md § Check and wire, so SKILL.md stays small. The marketplace copy is deleted (staged in jookoi-ai-market), so paper-trail installs only through ~/.agents now.
    ts_created: 2026-09-24T21:21:03Z
    ts_started: 2026-09-24T21:21:03Z
    ts_done: 2026-09-24T21:22:54Z
    ts_touched: 2026-09-24T21:22:54Z
  cmt8:
    title: 'Paper-trail: close the gaps from the second trial (markdown payloads, ack reason, grouped sweep, implementation-call trigger)'
    status: done
    priority: 54000
    body: |-
      Second trial (mobile-vault, 25-09-2026, implementing plans written by Fable) had hooks wired, and the record was still thin. The gate was satisfied by trivial store writes (`done` plus one body edit). `sweep --ack` was run before the work to clear 18 noisy paths. The agent's own implementation calls got no decision records, because the trigger table only covered calls the user agrees to. An `add` failed on hand-written YAML.

      Changes (synced to `~/.agents`):
      - `add`/`edit` accept markdown payloads: a `.md` file or stdin, optional frontmatter, a `# Title` line, then the body. The `SKILL.md` example now uses this form. YAML refusals print the quoting and indentation rules.
      - `sweep --ack "<reason>"` refuses without a reason of at least 15 characters and stores the reason in the ack file. `SKILL.md` says to record first and never ack first.
      - `sweep` groups changed files by folder and ends with a checklist of what changes carry: calls, including your own while implementing; topology, config or credential changes; work started or finished.
      - The trigger table has new rows for calls made while implementing or deviating from a plan (the plan's deviations section, or `new-decision`), and for `start`ing items when implementation begins.

      Not fixable mechanically: a gate can only check that the store was touched, not that the record is good. That part stays judgement.
    ts_created: 2026-09-24T21:46:08Z
    ts_started: 2026-09-24T21:46:08Z
    ts_done: 2026-09-24T21:46:12Z
    ts_touched: 2026-09-24T21:46:12Z
  d1ev:
    title: 'Paper-trail SKILL.md: restore v1''s event-triggered framing (description, why, setup last)'
    status: done
    priority: 55000
    body: |-
      Compared v1 (pre-v2 refactor, which worked well on TODO.md) with the current skill. The structural regressions:
      - **Description.** v1 was event-triggered: "writes anything worth remembering instead of losing it to the transcript, use whenever something durable happens", plus trigger phrasings and "match on intent", so the skill re-loaded on each durable event. The v2 refactor cut that to a short state-triggered line, and the 24-09-2026 rewrite ("kept current for the whole session", "use when a repo has _architecture/") made it load once per session. This was the main cause of the trial failures.
      - **Order.** v2 led with an ID rule and a setup-style session contract (list, sweep, hooks, compaction) ahead of the events.
      - **The why.** It was mostly gone. The table said what and where, not why.
      - **Medium.** Script-only writes with no prior read cost more than v1's direct `TODO.md` edit with the normal Edit tool. This change is intended and kept. Markdown payloads (cmt8 Paper-trail: close the gaps from the second trial) narrow the gap.

      Changes (synced to `~/.agents`):
      - The description is v1-style again: intent triggers, including calls you make while implementing, and phrasings like "let's go with".
      - New "Why this is your job" section: the transcript dies, unrecorded work is invisible, record in the same turn, and executing someone else's plan doesn't exempt you. The `paper-trail:` trail line moved there.
      - "When this runs" (events) now comes first, with a why on the doc-wrong row.
      - Setup, hooks and compaction moved to a short "Session start, hooks, compaction" section near the end that points to `references/hooks.md`. The ID rule moved to Hard rules.
      - `rehydrate.sh` text now matches: record in the same turn, whenever the trigger happens.

      Next check: a third trial, looking at whether the skill gets invoked mid-session on a decision without prompting.
    ts_created: 2026-09-24T21:49:17Z
    ts_started: 2026-09-24T21:49:17Z
    ts_done: 2026-09-24T21:49:21Z
    ts_touched: 2026-09-24T21:49:21Z
