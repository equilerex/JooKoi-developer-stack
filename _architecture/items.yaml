  n30g:
    title: Fold `my-repo-setup/` into toolboxes
    status: done
    priority: 80000
    body: |-
      `my-repo-setup/` is a copy-out bundle for new repos (Angular skills, seed `AGENTS.md`, `setup-scripts/`). A toolbox (for example an Angular box) from which all or part is copied into a project does the same job, so `my-repo-setup/` may become redundant.

      Raised 06-11-2026. Depends on the plan `_architecture/plans/2026-11-06-toolbox-third-party-manifest.md` (box layout, placement). Needs its own plan: the copy-into-project step (`copy:skill` in `utility-scripts` does part of it), the fate of the seed `AGENTS.md` template and `setup-scripts/`, and the tracked mirrors described in `AGENTS.md`.

      Open question, raised 06-11-2026: could `toolboxes/my-global-setup/` also become a box? Conflict: a box is opened on demand, the global folder is installed into `~/.agents` and loaded every session, and global installs were ruled out of toolboxes. Leaning: share the layout and the placement script (target = the box, or `~/.agents`), keep the folders separate, revisit the global folder after the placement script works. Waiting on the user's call.
