  t014:
    title: Wire up `jnote`'s missing half
    status: now
    priority: 14000
    body: 'Wire up `jnote`''s missing half. The tool ships and works, but nothing tells an agent to use it, so it stays empty. Needs an instruction layer written into `my-global-setup/.agents/AGENTS.md` first, then copied out by hand to `~/.agents/AGENTS.md` on this machine (the manual copy-out decision 009 requires), naming the triggers concretely rather than as a vague "log anything useful": subagents spawned without need, a skill or method visibly heavy on tokens, context lost to an avoidable re-read, confusion traceable to a specific instruction, and the positive case that matters most, a prompt fragment that keeps preventing hallucination or drift and should be considered for promotion into a global instruction file. The whole point is telemetry on our own processes that only the running agent can see. Open alongside it: the review path. Entries accumulate in `_architecture/process-improvement/logs.jsonl` with nothing reading them, so it needs a way to surface and triage them (a digest command, a periodic read, something), and a call on whether triaged findings route into the working-set store, into a decision, or straight into an instruction-file edit'
