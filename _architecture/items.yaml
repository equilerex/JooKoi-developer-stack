      - User tests `jj` in PowerShell, PowerShell 7, Git Bash and CMD (new windows).
      - Add-on ideas offered 06-11-2026 and not picked yet: project actions (start agent or editor after picking), recent picks first, edit-menu entry, open current folder, local model commands, quick jnote.
