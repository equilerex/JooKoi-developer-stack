  t017:
    title: Delegate `jookoi-paper-trail`'s mechanical half to a fork subagent
    status: now
    priority: 17000
    body: 'Delegate `jookoi-paper-trail`''s mechanical half to a **fork** subagent, so a flush stops eating main context — the judgement half (what happened, why, does it duplicate or invalidate an existing entry) is untransferable and stays in the main thread; the mechanics (read `SKILL.md`, read `TODO.md`/`BACKLOG.md`/`ARCHITECTURE.md`, find the anchor, apply, keep the format) are 3+ large files that are permanent in context once read and never looked at again — already the delegation trigger named in global `AGENTS.md`. Must be a fork, not a general-purpose agent: a cold agent has no access to what happened this session, which is the skill''s entire input, and would need that summary written into its prompt anyway; a fork inherits the context and keeps its tool output out of the parent. Contract the fork needs: the facts as bullets with the why, an explicit file/section allowlist, a standing fence around `TODO.md`''s `## Context` and any "do not re-derive" block (the most expensive institutional memory and the easiest thing for an agent to tidy away), "report, don''t write" when unsure an item already exists, and a receipt naming each file plus the exact anchor text matched — verified by targeted `grep` from the parent, never by trusting the receipt. Boundaries: chunk-boundary only, never concurrent with parent edits to the same files (lost writes), and not worth the overhead for a single checklist tick. Open: whether it ships as a `/flush` slash command that packages brief + fences + receipt contract, and whether `flush` and plain append want different fences. Adjacent to the "which judgement steps become mechanical" question in the item above, but a different mechanism — this delegates the work, it does not mechanize it'
    ts_created: null
    ts_started: null
    ts_done: null
    ts_touched: 2026-09-19
