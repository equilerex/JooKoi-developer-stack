      Done 24-09-2026. `~/.claude/settings.json` now wires Stop (`doc-gate.sh`), PreCompact (`preserve.sh`) and SessionStart `compact|startup|resume` (`rehydrate.sh`), all at `$HOME/.agents/skills/jookoi-paper-trail/hooks/`. The pre-merge backup is in this session's scratchpad only. This repo's own Stop and SubagentStop doc-gate entries are removed from `.claude/settings.json` so the gate doesn't run twice.

