    body: |-
      The Directory Opus skill (`jookoi-directory-opus-skill`, 72 files) is not approved for release: the Directory Opus owners ban AI-made content. It was committed in `c70f057` and pushed to the public repo `equilerex/JooKoi-developer-stack` (last push 27-10-2026). Found 06-11-2026.

      Done: `.gitignore` now ignores the skill folder and the box's `.claude/skills` under `toolboxes/windows-toolbox/`, so it is never added again. READMEs may still list it.

      Not done, user's call: deleting it from the working tree commit does not remove it from history. Options: rewrite history (`git filter-repo --path skill-toolboxes/windows-toolbox --invert-paths`, then force push, which anyone who cloned keeps), or make the repo private. A forked or cloned copy cannot be recalled.

      Also check: the plan `2026-10-28-directory-opus-power-user-default.md` and items iw5o Replace Directory Opus profiles with one power-user default, y4yt Directory Opus skill: no default app buttons, cmd button, build instead of ask and e5mo Name-width recipe: replace polling with event-driven apply and learn describe the skill and are tracked. The skill name cannot take the `_jookoi-` prefix (skill names allow lowercase letters, digits and hyphens), so privacy relies on the `.gitignore` entry.
