  paa3:
    title: 'Paper-trail: enforce use for the whole session (sweep gate, hooks check, body notes, trigger table)'
    status: done
    priority: 50000
    body: |-
      Came from the first trial session (triage/DeepSeek project, 24-09-2026). The agent set the store up and then stopped using it: title-only items, decisions and a token leak left only in chat, and no hooks wired.

      Changes, synced to the marketplace copy and `~/.agents`:
      - `SKILL.md`: new frontmatter description (it still said `TODO.md`), a "Session contract" (in force until the session ends, a `paper-trail:` trail line after each write, keep a line in any compaction summary), a trigger table replacing "When this runs", an "Items carry a body" section with an example, the ID rule now covers item bodies, the secret rule covers command output, and a list-nesting bug fixed.
      - Script: new `sweep [--gate] [--ack]` and `hooks` commands. `add`/`edit` print a note on an empty body or a bare-ID reference. `list` marks `(no body)`.
      - `doc-gate.sh`: now calls `sweep --gate`, which compares file times against the last store write or ack and has a 10-minute quiet window. The old "is `items.yaml` dirty" test went quiet for the whole session after the first store write. It exits silently in repos without `items.yaml`, so it can be wired globally. `SubagentStop`/`AgentStop` removed.
      - Hook configs: commands pointed at `.agents/...` relative to the repo, a path that never exists in a repo. They now use `$HOME/.agents/skills/...`.
      - `hooks.md`: a check-and-wire procedure. `legacy-migration.md`: hooks added as the last step.

      Tested in a scratch repo: silent without a store, blocks after a change, silent mid-block, silent after an ack, silent inside the quiet window.
    ts_created: 2026-09-24T21:13:00Z
    ts_started: 2026-09-24T21:13:00Z
    ts_done: 2026-09-24T21:13:04Z
    ts_touched: 2026-09-24T21:13:04Z
  yvh3:
