  e5mo:
    title: 'Name-width recipe: replace polling with event-driven apply and learn'
    status: now
    priority: 76000
    body: |-
      Incident 30-10-2026: the polling version of `JooKoiNameWidth.js` (from u61n Add scripting reference and name-width recipe to the Directory Opus skill) pushed `dopus.exe` to 35 GB private bytes and 819k handles over about 40 idle hours. Every read of `Tab.format` leaks about 4 handles and 150 KB, so a 700 ms poll leaked nonstop. A/B test: add-in on +86 handles per 14 s, off 0. Removing the per-tick file I/O did not help.

      Fix: v2.0 applies on `OnAfterFolderChange` / `OnActivateTab` through a one-shot timer, and learns a hand resize on `OnBeforeFolderChange`, `OnActivateTab`, `OnCloseTab` and `OnCloseLister`. Idle growth measured flat. Rule is in the recipe doc: never poll `Tab.format`.

      Next: the user tests by hand (resize, open another folder, check `name-width.txt` and the new folder's width). Mark done once that works.
    ts_created: 2026-10-30T20:25:53Z
    ts_started: 2026-10-30T20:28:07Z
    ts_done: null
    ts_touched: 2026-10-30T20:28:07Z
