  k0ur:
    title: Fix `setup-jnote.js` duplicating its profile block
    status: parked
    priority: 78000
    body: |-
      `upsertBlock` in `utility-scripts/setup-jnote.js` builds its regex from marker strings without escaping them. `(JooKoi-developer-stack)` becomes a capture group, so the old block never matches and every run appends another copy. The PS 5.1 profile has 3 copies, PS 7 has 2.

      Fix: escape the markers the way `toolboxes/shortcuts/setup-jj.mjs` does, then re-run `npm run setup:jnote` once to collapse the duplicates.
    ts_created: 2026-11-05T22:51:33Z
    ts_started: null
    ts_done: null
